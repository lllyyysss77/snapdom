name: Notify Cursor on star

on:
  watch:
    types: [started]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: POST to Cursor webhook
        env:
          AUTH: ${{ secrets.CURSOR_WEBHOOK_AUTH }}
          URL: ${{ secrets.CURSOR_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          endpoint="${URL:-https://api2.cursor.sh/automations/webhook/28bbdf7f-c168-5a86-9338-e13f1df5f060}"
          if [ -z "${AUTH:-}" ]; then
            echo "Missing secret CURSOR_WEBHOOK_AUTH" >&2
            exit 1
          fi
          payload=$(jq -n \
            --arg login "${{ github.event.sender.login }}" \
            --argjson stars "${{ github.event.repository.stargazers_count }}" \
            --arg action "${{ github.event.action }}" \
            '{sender:{login:$login},repository:{stargazers_count:$stars},action:$action,source:"github-actions-watch"}')
          curl -fsS -X POST "$endpoint" \
            -H "Authorization: ${AUTH}" \
            -H "Content-Type: application/json" \
            -d "$payload"
